<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F3ECDD">
  <!-- Added to the iPhone home screen, this opens as its own app (no Safari bars). -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pickleball">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Pickleball Pairing &amp; Scoring</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F3ECDD; }
    iframe { display: block; border: 0; width: 100%; height: 100vh; height: 100dvh; }

    /* Loading screen: shown over the app until the app says it has something to
       show (Google takes several seconds to start it), so the wait doesn't look
       like a blank, broken page. Same cream and ink as the app's own look. */
    #splash {
      position: fixed; inset: 0; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      background: #F3ECDD; color: #1D1A15;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .25s ease;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash .ball { width: 132px; height: 132px; filter: drop-shadow(0 0 12px rgba(198, 240, 0, .6)); animation: spin 1.3s linear infinite; }
    #splash .ball .fill { fill: #C6F000; }
    #splash .ball .ring { fill: none; stroke: #2B2F36; stroke-width: 2.6; }
    #splash .ball .sh { fill: #fff; }
    #splash .ball .ho { fill: none; stroke: #2B2F36; stroke-width: 2.2; }
    #splash .name { font-size: 22px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #2B2F36; }
    #splash .name b { font-weight: 600; color: #9BC400; }
    #splash .hint { font-size: 14px; line-height: 1.4; text-align: center; max-width: 280px; min-height: 3em; opacity: 0; transition: opacity .3s ease; }
    #splash .hint.show { opacity: .7; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #splash .ball { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <svg class="ball" viewBox="-100 -100 200 200" aria-hidden="true"><circle class="fill" cx="6" cy="6" r="74"/><g><g transform="translate(-27.6 -59.3)"><ellipse class="sh" cx="6" cy="5" rx="11" ry="9.5"/><ellipse class="ho" rx="11" ry="9.5"/></g><g transform="translate(19.9 -59.3)"><ellipse class="sh" cx="6" cy="5" rx="11" ry="9.5"/><ellipse class="ho" rx="11" ry="9.5"/></g><g transform="translate(-4.1 -31.7)"><ellipse class="sh" cx="6" cy="5" rx="11" ry="9.5"/><ellipse class="ho" rx="11" ry="9.5"/></g><g transform="translate(-62 -23.4)"><ellipse class="sh" cx="6" cy="5" rx="11" ry="9.5"/><ellipse class="ho" rx="11" ry="9.5"/></g><g transform="translate(55.2 -23.4)"><ellipse class="sh" cx="6" cy="5" rx="11" ry="9.5"/><ellipse class="ho" rx="11" ry="9.5"/></g><g transform="translate(-35.9 0)"><ellipse class="sh" cx="6" cy="5" rx="11" ry="9.5"/><ellipse class="ho" rx="11" ry="9.5"/></g><g transform="translate(27.6 0)"><ellipse class="sh" cx="6" cy="5" rx="11" ry="9.5"/><ellipse class="ho" rx="11" ry="9.5"/></g><g transform="translate(-63.4 22)"><ellipse class="sh" cx="6" cy="5" rx="11" ry="9.5"/><ellipse class="ho" rx="11" ry="9.5"/></g><g transform="translate(56.6 22)"><ellipse class="sh" cx="6" cy="5" rx="11" ry="9.5"/><ellipse class="ho" rx="11" ry="9.5"/></g><g transform="translate(-4.1 30.3)"><ellipse class="sh" cx="6" cy="5" rx="11" ry="9.5"/><ellipse class="ho" rx="11" ry="9.5"/></g><g transform="translate(-27.6 59.3)"><ellipse class="sh" cx="6" cy="5" rx="11" ry="9.5"/><ellipse class="ho" rx="11" ry="9.5"/></g><g transform="translate(19.3 59.3)"><ellipse class="sh" cx="6" cy="5" rx="11" ry="9.5"/><ellipse class="ho" rx="11" ry="9.5"/></g></g><circle class="ring" r="80"/></svg>
    <div class="name"><b>Pickle</b>ball</div>
    <div class="hint" id="hint">Still loading&hellip; the first open after a quiet spell can take a little longer.</div>
  </div>
  <!-- This page only exists to show the Apps Script app full-screen, which
       hides Google's "created by a Google Apps Script user" banner (that banner
       is drawn by Google's outer page, not by the app). The app itself lives at
       the address below; if its deployment address ever changes, change it here
       (and re-paste this file on GitHub). allow= lets the app use the phone's
       share sheet and the clipboard from inside this frame. -->
  <iframe id="app" title="Pickleball Pairing &amp; Scoring" allow="clipboard-write; web-share"></iframe>
  <noscript>This app needs JavaScript turned on.</noscript>
  <script>
    (function () {
      var APP = 'https://script.google.com/macros/s/AKfycbw04kr81cykbnrm8NBP4Elk2wXqGXE_0oEERvfd8BXEVdWEFoy-GExn-cMvb_uTQO4M/exec';
      var frame = document.getElementById('app');
      var splash = document.getElementById('splash');
      var hint = document.getElementById('hint');

      var src = APP;
      // A link like .../Pickleball/?tab=play is handed on to the app as
      // ...exec?tab=play. Only the tab name is passed, and only the four real
      // ones, so nothing else in the address can reach the app.
      var m = /(?:^\?|&)tab=([a-z]+)(?:&|$)/.exec(location.search || '');
      if (m && ['new', 'play', 'history', 'players'].indexOf(m[1]) !== -1) src += '?tab=' + m[1];
      frame.src = src;

      // Takes the loading screen down. The app sends {pickleball: 'ready'} once
      // it has something on screen (or an error to show). After a while the
      // screen also goes on its own, so it can never cover a working app for
      // good -- e.g. if an older version of the app, which doesn't send the
      // signal, is the one deployed.
      var gone = false;
      var hintTimer = setTimeout(function () { hint.classList.add('show'); }, 12000);
      var giveUpTimer = setTimeout(hideSplash, 40000);
      function hideSplash() {
        if (gone) return;
        gone = true;
        clearTimeout(hintTimer);
        clearTimeout(giveUpTimer);
        splash.classList.add('done');
        setTimeout(function () { splash.style.display = 'none'; }, 350);
      }

      // Only a message from inside the app's own frame counts: it must come
      // from a Google app address (*-script.googleusercontent.com) and from a
      // window nested inside #app (walks up event.source.parent to that frame).
      function fromOurApp(ev) {
        if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(ev.origin)) return false;
        var w = ev.source;
        for (var i = 0; w && i < 8; i++) {
          if (w === frame.contentWindow) return true;
          if (w === window) return false;
          try { w = w.parent; } catch (e) { return false; }
        }
        return false;
      }
      // Saved settings (theme, and the scorekeeper's phone id, game in progress
      // and voice). The app's own storage, inside Google's frame, is wiped when an
      // iPhone closes the app, so this page -- the real site, whose storage lasts --
      // keeps them for it: the app asks for them as it starts ("getPrefs") and sends
      // each change ("setPref"). Only pb-* keys, only from our app's own frame.
      var PREF_KEY = /^pb-[a-z0-9-]{1,40}$/;
      function savedPrefs() {
        var out = {};
        try {
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (PREF_KEY.test(k)) out[k] = localStorage.getItem(k);
          }
        } catch (e) { /* storage blocked: the app falls back to its own */ }
        return out;
      }

      window.addEventListener('message', function (ev) {
        var d = ev.data;
        if (!d || typeof d !== 'object' || !fromOurApp(ev)) return;
        if (d.pickleball === 'ready') hideSplash();
        else if (d.pickleball === 'getPrefs') {
          try { ev.source.postMessage({ pickleball: 'prefs', data: savedPrefs() }, ev.origin); } catch (e) {}
        } else if (d.pickleball === 'setPref' && typeof d.key === 'string' && PREF_KEY.test(d.key) &&
                   typeof d.value === 'string' && d.value.length <= 50000) {
          try { localStorage.setItem(d.key, d.value); } catch (e) {}
        }
      });
    })();
  </script>
</body>
</html>
