<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F3ECDD">
  <!-- Added to the iPhone home screen, this opens as its own app (no Safari bars). -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pickleball">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Pickleball Pairing &amp; Scoring</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F3ECDD; }
    iframe { display: block; border: 0; width: 100%; height: 100vh; height: 100dvh; }
  </style>
</head>
<body>
  <!-- This page only exists to show the Apps Script app full-screen, which
       hides Google's "created by a Google Apps Script user" banner (that banner
       is drawn by Google's outer page, not by the app). The app itself lives at
       the address below; if its deployment address ever changes, change it here
       (and re-paste this file on GitHub). allow= lets the app use the phone's
       share sheet and the clipboard from inside this frame. -->
  <iframe id="app" title="Pickleball Pairing &amp; Scoring" allow="clipboard-write; web-share"></iframe>
  <noscript>This app needs JavaScript turned on.</noscript>
  <script>
    (function () {
      var APP = 'https://script.google.com/macros/s/AKfycbw04kr81cykbnrm8NBP4Elk2wXqGXE_0oEERvfd8BXEVdWEFoy-GExn-cMvb_uTQO4M/exec';
      var src = APP;
      // A link like .../pickleball/?tab=play is handed on to the app as
      // ...exec?tab=play. Only the tab name is passed, and only the four real
      // ones, so nothing else in the address can reach the app.
      var m = /(?:^\?|&)tab=([a-z]+)(?:&|$)/.exec(location.search || '');
      if (m && ['new', 'play', 'history', 'players'].indexOf(m[1]) !== -1) src += '?tab=' + m[1];
      document.getElementById('app').src = src;
    })();
  </script>
</body>
</html>
